<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Draft · Slides (mock)</title>
<link rel="stylesheet" href="mock.css">
<style>
	.outline .sec { margin-bottom: 10px; }
	.outline .item { display: flex; gap: 8px; padding: 5px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.outline .item:hover { background: var(--panel2); }
	.outline .item.root { font-weight: 600; margin-top: 4px; }
	.outline .item.active { background: #1d2a44; box-shadow: inset 3px 0 var(--accent); }
	.outline .num { color: var(--accent); font-variant-numeric: tabular-nums; min-width: 34px; }
	.outline .t { overflow: hidden; text-overflow: ellipsis; }
	.split { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-width: 0; }
	.split.source { grid-template-columns: 1fr; } .split.source .prev { display: none; }
	.split.preview { grid-template-columns: 1fr; } .split.preview .src { display: none; }
	.pane { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
	.pane-h { padding: 6px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--panel); display: flex; gap: 8px; }
	textarea { flex: 1; resize: none; border: 0; outline: 0; background: #0d1014; color: #d6dde6; padding: 12px 16px; font: 13px/20px ui-monospace, Consolas, monospace; tab-size: 2; white-space: pre; }
	.preview-list { overflow: auto; padding: 16px 22px 60px; display: flex; flex-direction: column; gap: 22px; }
	.split.preview .preview-list { padding-inline: 12%; }
	.pv-h { display: flex; gap: 8px; align-items: center; font-size: 12px; margin-bottom: 6px; color: var(--muted); }
	.pv-h .num { color: var(--accent); font-weight: 600; }
	.pv-h select { padding: 1px 6px; font-size: 12px; }
	.pv .scaler { box-shadow: 0 0 0 1px var(--line); }
	.pv.active .scaler { box-shadow: 0 0 0 2px var(--accent); }
	.statusbar.err { color: var(--err); }
	.statusbar.warn { color: var(--warn); }
	.split[hidden], .master[hidden] { display: none; }
	.master { flex: 1; display: grid; grid-template-columns: 360px 1fr; min-width: 0; min-height: 0; }
	.mform { overflow: auto; padding: 10px 16px 40px; background: var(--panel); border-right: 1px solid var(--line); }
	.mrow { display: grid; grid-template-columns: 118px 1fr 22px; gap: 8px; align-items: center; padding: 3px 0; font-size: 13px; }
	.mrow input[type=color] { width: 100%; height: 28px; padding: 1px 3px; }
	.mrow input, .mrow select { min-width: 0; }
	.mrow.ov > label:first-child::after { content: " •"; color: var(--accent); }
	.mrow .rst { visibility: hidden; padding: 0; border: 0; background: none; color: var(--accent); }
	.mrow.ov .rst { visibility: visible; }
	.mgrid { overflow: auto; padding: 16px 22px 60px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; align-content: start; }
	.mthumb.active .scaler { box-shadow: 0 0 0 2px var(--accent); }
	.mthumb.over .scaler { box-shadow: 0 0 0 2px var(--warn); }
</style>
</head>
<body>
<header class="topbar">
	<a href="index.html" target="_blank">← My Decks</a>
	<strong id="title"></strong><span class="muted small" id="path"></span>
	<span class="pill ok" id="save">✓ Saved</span>
	<div class="grow"></div>
	<label class="small muted">Theme <select id="theme"></select></label>
	<div class="seg" id="view"><button data-v="source">Source</button><button data-v="split" class="on">Split</button><button data-v="preview">Preview</button></div>
	<button id="export">⤓ Export</button>
	<button class="primary" id="present">▶ Present</button>
</header>
<div class="layout">
	<aside class="sidebar outline" id="outline"></aside>
	<main class="split" id="split">
		<section class="pane src"><div class="pane-h" id="file"></div><textarea id="src" spellcheck="false"></textarea></section>
		<section class="pane prev"><div class="pane-h">Preview <span>· exactly as presented · click text to edit it here</span></div><div id="preview" class="preview-list"></div></section>
	</main>
	<main class="master" id="masterView" hidden>
		<section class="mform" id="mform"></section>
		<section class="pane"><div class="pane-h"><span>Presentation master · whole-deck preview · every slide, template and child slide inherits these settings</span><span class="grow"></span><span id="mwarn"></span></div><div id="mgrid" class="mgrid"></div></section>
	</main>
</div>
<footer class="statusbar" id="diag"></footer>
<script src="mock.js"></script>
<script>
const d = getDeck(param('deck')), ta = $('#src');
let deck = null, lastValid = null, active = null, saveTimer, renderTimer, view = 'split', editView = 'split';
ta.value = loadSource(d.id);
$('#path').textContent = `${d.dir}/${d.file}`;
$('#file').textContent = d.file;
const themeOptions = Object.entries(THEMES).map(([k, t]) => `<option value="${k}">${t.name}</option>`).join('') + '<option disabled>… 14 presets in v1</option>';
$('#theme').innerHTML = themeOptions;

// ---- Presentation master form (built once; values synced from the parsed source) ----
const MASTER_GROUPS = [
	['Palette', [['surface', 'Background'], ['text', 'Text'], ['accent', 'Accent'], ['muted', 'Muted text']]],
	['Typography', [['headingFont', 'Heading font'], ['headingSize', 'Heading size'], ['bodyFont', 'Body font'], ['bodySize', 'Body size'], ['codeFont', 'Code font'], ['codeSize', 'Code size']]],
	['Background', [['background', 'Style'], ['backdrop', 'Animated backdrop']]],
	['Shared elements', [['logo', 'Logo'], ['footer', 'Footer text'], ['footerNumber', 'Slide number']]],
];
const OPTION_LABELS = { solid: 'Solid', gradient: 'Gradient', band: 'Accent band', off: 'Off', drift: 'Slow drift' };
const MONO = /Consolas|Cascadia|Courier/;
function masterControl(k) {
	const f = MASTER_FIELDS[k];
	if (f === 'color') return `<input type="color" data-k="${k}">`;
	if (f === 'size') return `<input type="number" min="8" max="200" step="2" data-k="${k}" title="Pixels on the 1600×900 stage">`;
	if (f === 'font') return `<select data-k="${k}">${Object.keys(FONTS).filter(n => (k === 'codeFont') === MONO.test(n)).map(n => `<option>${n}</option>`).join('')}</select>`;
	if (f === 'bool') return `<label class="small"><input type="checkbox" data-k="${k}"> Show in footer</label>`;
	if (Array.isArray(f)) return `<select data-k="${k}">${f.map(v => `<option value="${v}">${OPTION_LABELS[v]}</option>`).join('')}</select>`;
	return `<input data-k="${k}" placeholder="${k === 'logo' ? 'e.g. ◆ Acme' : 'Uses the deck title'}">`;
}
$('#mform').innerHTML = `<div class="row" style="margin:2px 0 6px"><button data-back>← Back to editor</button></div>
	<h4>Theme preset</h4><div class="row"><select id="mTheme" class="grow">${themeOptions}</select><button id="mReset" title="Remove all overrides">Reset</button></div>
	<p class="small muted" id="mOv"></p>` +
	MASTER_GROUPS.map(([h, rows]) => `<h4>${h}</h4>` + rows.map(([k, label]) => `<div class="mrow"><label>${label}</label>${masterControl(k)}<button class="rst" data-reset="${k}" title="Reset to preset">↺</button></div>`).join('')).join('') +
	`<p class="small muted" style="margin-top:12px">Animated backdrops are off by default, pause under reduced motion, and export as a static frame.</p>
	<p class="small muted">Saved in the deck's front matter (<code>master:</code>) as the theme plus only the settings you change. Applies to draft previews, draft exports and newly started presentations; running presentations keep their captured master.</p>`;

function syncMasterForm(meta) {
	const r = meta.master, ov = meta.overrides, n = Object.keys(ov).length, name = THEMES[meta.theme]?.name || meta.theme;
	$('#mTheme').value = meta.theme; $('#mReset').disabled = !n;
	$('#mOv').textContent = n ? `${n} override${n > 1 ? 's' : ''} on top of ${name} · switching presets keeps them` : `Using ${name} preset values.`;
	$$('#mform [data-k]').forEach(el => {
		const k = el.dataset.k; el.closest('.mrow').classList.toggle('ov', k in ov);
		if (el === document.activeElement) return;
		if (el.type === 'checkbox') { el.checked = r[k]; return; }
		if (el.tagName === 'SELECT' && ![...el.options].some(o => o.value === String(r[k]))) el.add(new Option(`${r[k]} (not installed)`, r[k]));
		el.value = r[k];
	});
	$('#mform [data-k=backdrop]').disabled = r.background !== 'gradient';
}

function renderMaster(show) {
	syncMasterForm(show.meta);
	$('#mgrid').innerHTML = show.slides.map(s => `<div class="thumb mthumb${s.id === active ? ' active' : ''}" data-id="${esc(s.id)}" data-num="${s.num}">${scaled(slideHTML(s, show.meta))}
		<div class="cap"><span class="num">${s.num}</span><span>${esc(s.title)}</span><span class="grow"></span><span class="muted">${LAYOUTS[s.layout]}</span></div></div>`).join('');
	observeScalers($('#mgrid'));
	// Warn about overflow instead of silently clipping (FR-045).
	const over = $$('#mgrid .mthumb').filter(t => $$('.slide, .body', t).some(b => b.scrollHeight > b.clientHeight + 2));
	over.forEach(t => t.classList.add('over'));
	$('#mwarn').innerHTML = over.length ? `<span style="color:var(--warn)">⚠ Content overflows on ${over.map(t => t.dataset.num).join(', ')}; reduce sizes or split the slide</span>` : '<span style="color:var(--ok)">✓ All slides fit</span>';
}

function applyMaster(k, v) { ta.value = k === 'reset' ? resetMaster(ta.value) : setMaster(ta.value, k, v); markDirty(); render(); }
$('#mform').addEventListener('input', e => { const el = e.target; if (el.dataset.k && (el.type === 'color' || el.type === 'text')) applyMaster(el.dataset.k, el.value); });
$('#mform').addEventListener('change', e => { const el = e.target; if (el.dataset.k) applyMaster(el.dataset.k, el.type === 'checkbox' ? el.checked : el.value); });
$('#mform').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.reset) applyMaster(b.dataset.reset, undefined); if ('back' in b.dataset) setView(editView); });
$('#mTheme').onchange = e => applyMaster('theme', e.target.value);
$('#mReset').onclick = () => applyMaster('reset');
$('#mgrid').onclick = e => { const t = e.target.closest('.mthumb'); if (!t) return; active = t.dataset.id; setView(editView); setActive(t.dataset.id, { scrollPreview: true, moveCaret: true }); };

// Same draft document: master and editor are History API views, like /draft/:id/master.
function setView(v, push = true) {
	const m = v === 'master', changed = m !== (view === 'master');
	view = v; if (!m) editView = v;
	$('#split').hidden = m; $('#masterView').hidden = !m;
	if (!m) $('#split').className = 'split ' + v;
	$$('#view button').forEach(x => x.classList.toggle('on', x.dataset.v === v));
	if (push && changed) history.pushState(null, '', `?deck=${d.id}${m ? '&view=master' : ''}`);
	render();
	$(m ? '.mthumb.active' : '.pv.active')?.scrollIntoView({ block: 'nearest' });
}
addEventListener('popstate', () => setView(param('view') === 'master' ? 'master' : editView, false));

function markDirty() {
	$('#save').className = 'pill warn'; $('#save').textContent = '● Saving…';
	clearTimeout(saveTimer);
	saveTimer = setTimeout(() => { saveSource(d.id, ta.value); $('#save').className = 'pill ok'; $('#save').textContent = '✓ Saved'; }, 700);
}

function render() {
	deck = parseDeck(ta.value);
	const ok = !deck.errors.length;
	if (ok) { lastValid = deck; localStorage.setItem('mock-valid-' + d.id, ta.value); }
	const show = lastValid || deck;
	const warns = ok ? deck.warnings : [];
	$('#diag').className = 'statusbar' + (ok ? (warns.length ? ' warn' : '') : ' err');
	$('#diag').innerHTML = !ok ? deck.errors.map(e => `⚠ Line ${e.line}: ${esc(e.msg)}`).join(' &nbsp; ') + ' — showing last valid preview'
		: warns.length ? warns.map(e => `⚠ Line ${e.line}: ${esc(e.msg)}`).join(' &nbsp; ') + ` · ${show.slides.length} slides`
		: `✓ No problems · ${show.slides.length} slides · autosave on`;
	$('#title').textContent = show.meta.title; document.title = show.meta.title + (view === 'master' ? ' · Master' : ' · Draft');
	$('#theme').value = show.meta.theme;
	renderOutline(show);
	if (view === 'master') renderMaster(show);
	if (document.activeElement?.closest?.('#preview')) return; // do not rebuild while typing in preview
	$('#preview').innerHTML = show.slides.map(s => `<div class="pv${s.id === active ? ' active' : ''}" id="pv-${esc(s.id)}" data-id="${esc(s.id)}">
		<div class="pv-h"><span class="num">${s.num}</span><span>${esc(s.title)}</span><span class="grow"></span>
		${s.reveals ? `<span>${s.reveals} reveal steps</span>` : ''}${s.notes.length ? '<span>· has notes</span>' : ''}
		<select data-layout="${esc(s.id)}" title="Slide template">${Object.entries(LAYOUTS).map(([k, v]) => `<option value="${k}"${k === s.layout ? ' selected' : ''}>${v}</option>`).join('')}</select></div>
		${scaled(slideHTML(s, show.meta, { editable: ok, markReveals: true }))}</div>`).join('');
	observeScalers($('#preview'));
}

function renderOutline(show) {
	const item = s => `<div class="item${s.depth ? '' : ' root'}${s.id === active ? ' active' : ''}" data-id="${esc(s.id)}" style="padding-left:${8 + s.depth * 16}px"><span class="num">${s.num}</span><span class="t">${esc(s.title)}</span></div>`;
	const sub = s => item(s) + s.children.map(sub).join('');
	$('#outline').innerHTML = `<h4 style="margin-top:4px">Slides</h4>` + show.roots.map(r => `<div class="sec">${sub(r)}</div>`).join('') +
		`<h4>Deck</h4><div class="item${view === 'master' ? ' active' : ''}" data-view="master">🎨 Presentation master</div>`;
}

function setActive(id, { scrollPreview = false, moveCaret = false } = {}) {
	active = id;
	$$('.outline .item[data-id], .pv, .mthumb').forEach(el => el.classList.toggle('active', el.dataset.id === id));
	const s = (lastValid || deck).slides.find(x => x.id === id);
	if (!s) return;
	if (scrollPreview) (view === 'master' ? $(`.mthumb[data-id="${CSS.escape(id)}"]`) : $('#pv-' + CSS.escape(id)))?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
	if (moveCaret && view !== 'master') {
		const pos = ta.value.split('\n').slice(0, s.line).join('\n').length + (s.line ? 1 : 0);
		ta.focus({ preventScroll: true }); ta.setSelectionRange(pos, pos); ta.scrollTop = Math.max(0, s.line * 20 - 60);
	}
}

// Source -> preview
ta.addEventListener('input', () => { markDirty(); clearTimeout(renderTimer); renderTimer = setTimeout(render, 120); });
const caretSync = () => {
	const line = ta.value.slice(0, ta.selectionStart).split('\n').length - 1;
	const s = [...(lastValid || deck).slides].sort((a, b) => b.line - a.line).find(x => x.line <= line);
	if (s && s.id !== active) setActive(s.id, { scrollPreview: true });
};
ta.addEventListener('click', caretSync); ta.addEventListener('keyup', caretSync);

// Preview -> source (edit text in place; template and theme pickers rewrite front matter)
$('#preview').addEventListener('input', e => {
	const el = e.target.closest('[data-line]'); if (!el) return;
	const lines = ta.value.split('\n'), n = +el.dataset.line;
	lines[n] = lines[n].match(/^\s*(#{1,6}\s+|[-*]\s+|>\s?)?/)[0] + el.textContent.replace(/\n/g, ' ');
	ta.value = lines.join('\n'); markDirty();
	renderOutline(parseDeck(ta.value));
});
$('#preview').addEventListener('focusout', () => setTimeout(render));
$('#preview').addEventListener('change', e => { const id = e.target.dataset.layout; if (id) { ta.value = setLayout(ta.value, id, e.target.value); markDirty(); render(); } });
$('#preview').addEventListener('click', e => { const pv = e.target.closest('.pv'); if (pv && !e.target.closest('select,[contenteditable]')) setActive(pv.dataset.id, { moveCaret: true }); });
$('#theme').onchange = e => { ta.value = setTheme(ta.value, e.target.value); markDirty(); render(); };

$('#outline').onclick = e => {
	const it = e.target.closest('.item'); if (!it) return;
	if (it.dataset.view) setView('master'); else setActive(it.dataset.id, { scrollPreview: true, moveCaret: true });
};
$('#view').onclick = e => { const b = e.target.closest('button'); if (b) setView(b.dataset.v); };
$('#present').onclick = () => {
	if (deck.errors.length && !confirm('The current draft has problems.\n\nPresent the last valid version instead? (It is older than your current edits.)')) return;
	saveSource(d.id, ta.value); window.open(`present.html?deck=${d.id}`, '_blank');
};
$('#export').onclick = () => window.open(`export.html?deck=${d.id}&from=draft`, '_blank');

setView(param('view') === 'master' ? 'master' : 'split', false);
setActive(location.hash.slice(1) || deck.slides[0]?.id, { scrollPreview: true, moveCaret: !!location.hash });
</script>
</body>
</html>
